[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panel-screen-dsl"
version = "0.1.0"
description = "A point-in-time, factor-aware equity-screening pipeline DSL."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Charlie Griege" }]
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["panel_screen_dsl"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
